# CI/CD pipeline - Intelligent Recommendation Platform (Milestone 3)
#
# Stages: tests run only if quality passed; benchmark and docker run in
# parallel once tests passed.
#   1. quality    - ruff (lint), black (format), mypy (types)
#   2. tests      - 300 unit, integration, failure-injection and system tests
#   3. benchmark  - p95 latency vs NFR-01 (fails the build over 200 ms) and
#                   memory profile, published as artifacts
#   4. docker     - builds the image, smoke-tests that same image and, only on
#                   main and only after the smoke test passed, pushes it to GHCR
#
# The workflow reports a red build for broken style, wrong types, a failing
# test, a latency regression or an image that does not start. Blocking merges
# on it requires branch protection with required status checks on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install tools and runtime dependencies
        run: |
          pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy

  tests:
    name: Test suite
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ".[dev,als]"
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml

  benchmark:
    name: Latency and memory
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ".[als]" psutil
      - name: p95 latency (exits non-zero above 200 ms)
        # WARNING keeps the per-request INFO logs out of the JSON report.
        env:
          RECO_LOG_LEVEL: WARNING
        run: python benchmarks/latency_p95.py --requests 500 --json | tee reports/latency_p95.json
      - name: Memory profile
        run: python benchmarks/memory_profile.py --requests 500
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/

  docker:
    name: Build image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recommendation-platform:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name reco -p 8000:8000 "$IMAGE"
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/health
          curl -fs "http://127.0.0.1:8000/recommendations/1?k=5"
          docker rm -f reco
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
