apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
  labels: {app: recommendation-platform, component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: recommendation-platform, component: api}
  template:
    metadata:
      labels: {app: recommendation-platform, component: api}
    spec:
      containers:
        - name: api
          image: recommendation-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: recommendation-config}
          # Measured in Milestone 3: one uvicorn worker holds ~190 MB RSS
          # (PyTorch + four strategies) and saturates about one CPU core.
          resources:
            requests: {cpu: "500m", memory: "384Mi"}
            limits: {cpu: "1", memory: "768Mi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        # Per-pod scratch space for the error journal and the local history
        # fallback. With several replicas the history must move to MongoDB
        # (RECO_MONGO_URL), because local files are not shared between pods.
        - name: data
          emptyDir: {}
