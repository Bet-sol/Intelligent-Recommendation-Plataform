apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-redis
  labels: {app: recommendation-platform, component: cache}
spec:
  replicas: 1
  selector:
    matchLabels: {app: recommendation-platform, component: cache}
  template:
    metadata:
      labels: {app: recommendation-platform, component: cache}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: {cpu: "100m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-redis
spec:
  selector: {app: recommendation-platform, component: cache}
  ports:
    - port: 6379
      targetPort: 6379
