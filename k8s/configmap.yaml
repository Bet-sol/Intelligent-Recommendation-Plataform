apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-config
  labels: {app: recommendation-platform}
data:
  WORKERS: "1"
  RECO_ACTIVE_STRATEGY: "als"
  RECO_FALLBACK_STRATEGY: "popularity"
  RECO_LOG_LEVEL: "INFO"
  # Shared cache across replicas (see redis.yaml). Leave empty to keep a
  # per-pod in-memory cache.
  RECO_REDIS_URL: "redis://recommendation-redis:6379/0"
